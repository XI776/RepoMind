[project]
name = "repomind"
version = "0.1.0"
description = "Versioned Python repository structure index"
readme = "README.md"
authors = [
    { name = "XI776", email = "3157941570@qq.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
repomind = "repomind:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
